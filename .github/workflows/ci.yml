name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lex
        run: |
          set -euo pipefail
          V=$(grep -m1 '^lex ' lex.toml | sed 's/.*= *"\(.*\)"/\1/')
          T=x86_64-unknown-linux-gnu
          curl -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "https://github.com/alpibrusl/lex-lang/releases/download/v$V/lex-v$V-$T.tar.gz" -o /tmp/lex.tgz
          tar -xzf /tmp/lex.tgz -C /tmp
          echo "/tmp/lex-v$V-$T" >> "$GITHUB_PATH"
      - name: Type-check
        run: |
          set -e
          fail=0
          for f in $(git ls-files 'src/*.lex' 'tests/*.lex'); do
            lex check "$f" >/dev/null 2>&1 || { echo "::error file=$f::lex check failed"; lex check "$f" 2>&1 | head -3; fail=1; }
          done
          exit $fail
      - name: Format check
        run: lex fmt --check src tests
      # The examples in a typed issue are a finite list; an implementation can
      # satisfy them one by one and refuse everything else (it happened here).
      # These properties are what a table of vectors cannot pass.
      - name: Property tests
        run: lex test --allow-effects crypto,fs_read,fs_write,io,random,sql,time tests
